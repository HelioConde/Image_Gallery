# Safety fallback for repositories still configured to publish GitHub Pages from main.
# The custom Actions deployment explicitly includes only public static assets.
exclude:
  - save.php
  - tests
  - scripts
  - docs
  - node_modules
  - .github
  - .gitignore
  - README.md
  - package.json
  - package-lock.json
  - playwright.config.js
  - playwright.visual.config.js
  - test-results
  - playwright-report
  - visual-playwright-report
