name: Publish Image Gallery to GitHub Pages
on:
  workflow_run:
    workflows: ["Quality and visual audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: image-gallery-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Assemble safe static distribution
        run: |
          mkdir -p dist
          cp index.html enviado.html images.json dist/
          cp -R css js img dist/
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/images.json
          test ! -e dist/save.php
          test ! -e dist/tests
          test ! -e dist/node_modules
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy verified gallery
        id: deployment
        uses: actions/deploy-pages@v4

  audit-live-site:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VISUAL_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm public gallery responds
        run: |
          curl --fail --location --silent --show-error --retry 8 --retry-delay 6 --retry-all-errors "$VISUAL_BASE_URL" -o /tmp/gallery-live.html
          grep -q 'Image Gallery' /tmp/gallery-live.html
      - name: Install browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Audit published URL in nine resolutions
        run: npm run test:visual
      - name: Generate real-site visual report
        if: always()
        run: |
          npm run qa:report
          cat test-results/visual-audit/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload live-site screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-gallery-live-site-qa
          path: |
            test-results/
            visual-playwright-report/
          if-no-files-found: ignore
          retention-days: 21
